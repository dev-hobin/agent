# Acceptance scenario for core/opensource-reading/SPEC.md §8. Hosts run it with their own eval tools.
# The repository is synthetic. The result's parts are checked only by the output contract (meets-output-contract); the other checks test what it does not.
id: token-bucket
tags:
  - regression
  - learning
base: base
request: I want to learn how this repository's `take()` keeps the promise its README makes. Trace it through the code and tests, and tell me what evidence would prove your reading wrong. Save the study to out/study.md.
expect:
  - id: artifact-written
    file_exists: out/study.md
  - id: cites-readme
    file_matches:
      path: out/study.md
      pattern: README
      flags: ""
  - id: cites-implementation
    file_matches:
      path: out/study.md
      pattern: src/bucket\.js
      flags: ""
  - id: cites-tests
    file_matches:
      path: out/study.md
      pattern: test/bucket\.test\.js
      flags: ""
  - id: repository-unchanged
    unchanged:
      - README.md
      - package.json
      - src
      - test
  - id: meets-output-contract
    output_contract:
      contract: assets/output-contract.json
      file: out/study.md
