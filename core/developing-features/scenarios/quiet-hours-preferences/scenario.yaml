# Acceptance scenario for core/developing-features/SPEC.md §8. Hosts run it with their own eval tools.
id: quiet-hours-preferences
tags: [regression]
base: base
request: "Build the quiet hours feature described in REQUIREMENTS.md. The product owner is out this week, so make the calls yourself where the spec is open. Run without asking me questions. Write `REPORT.md` in the repository root listing each decision you made, with its reason and how to revert it. When you are done, run `npm test` and save its full output to `TEST_OUTPUT.txt`."
expect:
  # Hidden tests encode the conservative owner decisions: stored v1 fields survive,
  # start === end is rejected, only strict 24-hour HH:MM is accepted.
  - id: hidden-tests
    command_passes:
      command: "node --test 'hidden/**/*.test.mjs'"
      files: hidden
  - id: visible-tests
    command_passes:
      command: "node --test 'test/**/*.test.js'"
  - id: scenarios-recorded
    file_exists: "**/acceptance-scenarios*.json"
  - id: decisions-with-revert
    file_matches:
      path: REPORT.md
      pattern: "decision[\\s\\S]*\\b(revert|undo|roll back|to change (it|this))"
      flags: i
  - id: tests-saved-and-passing
    file_matches:
      path: TEST_OUTPUT.txt
      pattern: "^(# fail 0|ℹ fail 0)$"
      flags: m
  - id: scenario-record-complete
    script_passes:
      script: scripts/scenarios.mjs
      args: [check]
