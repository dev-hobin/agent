# Acceptance scenario for core/review/SPEC.md §8. Hosts run it with their own eval tools.
# A finding runs from its `[P…]` line to the next `[P` line or the end, as in scripts/check-report.mjs.
id: queue-worker-ack
tags: [regression]
base: base
change: change.patch
request: "Review this change before I merge. Context from the author: \"Fixes redelivery storms on slow jobs by acking early, and adds in-place retries for transient ledger errors.\" Write the review to `REVIEW.md` in the repository root in the review report format: each finding as `[P0|P1] <defect> — <file>:<line>` followed by `Scenario:` and `Evidence:` lines, or the single line `No findings`. Do not change any other file."
expect:
  - id: review-written
    file_exists: REVIEW.md
  - id: finds-early-ack
    file_matches:
      path: REVIEW.md
      pattern: "^\\[P[01]\\](?:(?!\\n\\[P\\d\\])[\\s\\S])*?\\b(ack|acknowledg)"
      flags: im
  - id: finds-retry-double-credit
    file_matches:
      path: REVIEW.md
      pattern: "^\\[P[01]\\](?:(?!\\n\\[P\\d\\])[\\s\\S])*?(idempot|double|twice|duplicate)"
      flags: im
  - id: no-flag-pending-count
    file_lacks:
      path: REVIEW.md
      pattern: "\\[P[01]\\][^\\n]*pendingCount"
  - id: no-other-changes
    unchanged_except: [REVIEW.md]
  - id: report-format
    script_passes:
      script: scripts/check-report.mjs
      args: [REVIEW.md]
