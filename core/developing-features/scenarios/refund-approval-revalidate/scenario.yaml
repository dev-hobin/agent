# Acceptance scenario for core/developing-features/SPEC.md §8. Hosts run it with their own eval tools.
id: refund-approval-revalidate
tags: [regression]
base: base
request: "Implement refund approval per REQUIREMENTS.md in src/approve.js. The owner can't be reached, so decide the open questions conservatively. Don't stop to ask. Write `REPORT.md` in the repository root listing each decision you made, with its reason and how to revert it. When you are done, run `npm test` and save its full output to `TEST_OUTPUT.txt`."
expect:
  # Hidden tests require revalidation before the irreversible refund, refusal of
  # over-refund and fractional cents, and one effective refund under a double click.
  - id: hidden-tests
    command_passes:
      command: "node --test 'hidden/**/*.test.mjs'"
      files: hidden
  - id: visible-tests
    command_passes:
      command: "node --test 'test/**/*.test.js'"
  - id: scenarios-recorded
    file_exists: "**/acceptance-scenarios*.json"
  - id: decisions-with-revert
    file_matches:
      path: REPORT.md
      pattern: "decision[\\s\\S]*\\b(revert|undo|roll back|to change (it|this))"
      flags: i
  - id: tests-saved-and-passing
    file_matches:
      path: TEST_OUTPUT.txt
      pattern: "^(# fail 0|ℹ fail 0)$"
      flags: m
  - id: scenario-record-complete
    script_passes:
      script: scripts/scenarios.mjs
      args: [check]
