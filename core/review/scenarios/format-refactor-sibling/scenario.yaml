# Acceptance scenario for core/review/SPEC.md §8. Hosts run it with their own eval tools.
# A finding runs from its `[P…]` line to the next `[P` line or the end, as in scripts/check-report.mjs.
id: format-refactor-sibling
tags: [regression]
base: base
change: change.patch
request: "Can you review this change before I merge? Author says: \"Refactored amount formatting into a shared helper and added thousands separators. The new grouping tests pass.\" Write the review to `REVIEW.md` in the repository root in the review report format: each finding as `[P0|P1] <defect> — <file>:<line>` followed by `Scenario:` and `Evidence:` lines, or the single line `No findings`. Do not change any other file."
expect:
  - id: review-written
    file_exists: REVIEW.md
  - id: finds-broken-existing-test
    file_matches:
      path: REVIEW.md
      pattern: "^\\[P[01]\\](?:(?!\\n\\[P\\d\\])[\\s\\S])*?(machine-readable|existing test|format\\.test|1,234\\.50)"
      flags: im
  - id: finds-untested-sibling
    file_matches:
      path: REVIEW.md
      pattern: "^\\[P[01]\\](?:(?!\\n\\[P\\d\\])[\\s\\S])*?formatSigned"
      flags: m
  - id: finds-csv-column-split
    file_matches:
      path: REVIEW.md
      pattern: "^\\[P[01]\\](?:(?!\\n\\[P\\d\\])[\\s\\S])*?(csv|toCsv)"
      flags: im
  - id: no-flag-destructuring
    file_lacks:
      path: REVIEW.md
      pattern: "\\[P[01]\\][^\\n]*destructur"
      flags: i
  - id: no-other-changes
    unchanged_except: [REVIEW.md]
  - id: report-format
    script_passes:
      script: scripts/check-report.mjs
      args: [REVIEW.md]
