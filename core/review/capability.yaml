# Interface of the code-review capability. Implementations under implementations/<host>/
# render it into each host's native form; nothing here names a host.
id: reviewing-code
plugin: hobin-review
version: 0.3.0
title: Hobin Review
summary: >-
  Reviews a code change, or a bounded existing scope, for correctness defects by
  running one focused pass per applicable perspective and reporting only verified,
  high-confidence findings with concrete failure scenarios.
use_when: >-
  Use only when explicitly asked to review a diff, branch, or pull request, or to
  diagnose a named module or feature slice.
not_for: >-
  Not for style feedback, automatic repair, environment setup checks, or
  whole-repository rewrites.
short: Review a change for verified correctness defects
invocation: explicit          # explicit: only the user starts it; implicit: the model may choose it
argument: "[what to review: a branch, diff, pull request, or named scope]"

# Strategy, not a promise: for a change that spans several perspectives, an independent
# reviewer per perspective (with only its perspective, the reviewer role, and the
# context) is recommended. Implementations offer it in their host's form; the run decides.
strategy:
  role: reviewer.md
  per: perspectives
  when: the change is large or spans several perspectives
perspectives:
  - id: contract
    source: sources/lenses/contract.md
    summary: requirements, absence and default semantics, invariants, owner decisions, boundary parsing
  - id: async-flow
    source: sources/lenses/async-flow.md
    summary: jobs, queues, callbacks, retries, acknowledgement, cancellation, stale state
  - id: structure
    source: sources/lenses/structure.md
    summary: responsibility and boundary placement, abstractions, variation mechanisms, names, refactors mixed with behavior
  - id: data-loss
    source: sources/lenses/data-loss.md
    summary: transformations, migrations, normalization, serialization, scrubbing of stored data
  - id: evidence
    source: sources/lenses/evidence.md
    summary: whether tests and checks actually observe the claims the change makes

# What the capability promises, independent of host. Each implementation declares in its
# build how strongly it meets each one: enforced (the host guarantees it), instructed (the
# skill asks for it and contract runs measure adherence), or unsupported.
# Guarantees are observable outcomes only; how a host achieves them is its own detail.
guarantees:
  - id: explicit-invocation
    level: required
    means: only the user starts the capability; the model never selects it on its own
  - id: no-code-changes
    level: required
    means: the review leaves the reviewed code unchanged and writes only its report
  - id: verified-findings
    level: required
    means: findings follow the fixed format and each names a concrete failure scenario

scripts:
  - file: scripts/collect-context.sh
    usage: "[base]"
    summary: read-only; prints the range, changed files, nearby tests, instruction files, and the diff (git only)
