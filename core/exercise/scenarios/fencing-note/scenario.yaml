# Acceptance scenario for core/exercise/SPEC.md §8. Hosts run it with their own eval tools.
# The concept note is synthetic. The result's parts are checked only by the output contract (meets-output-contract); the other checks test what it does not.
id: fencing-note
tags:
  - regression
  - learning
base: base
request: I wrote up notes/fencing-tokens.md after reading about leases. Make me a short practice workbook so I can show I can actually use the idea, not just repeat the words. Save it to out/exercise.md.
expect:
  - id: artifact-written
    file_exists: out/exercise.md
  - id: notes-unchanged
    unchanged:
      - notes
  - id: meets-output-contract
    output_contract:
      contract: assets/output-contract.json
      file: out/exercise.md
