# Acceptance scenario for core/conceptualize/SPEC.md §8. Hosts run it with their own eval tools.
# The result's parts are checked only by the output contract (meets-output-contract); the other checks test what it does not.
id: retry-notes
tags: [regression, learning]
base: base
request: "Use the conceptualize skill for this.\n\nThe three notes in notes/ come from different incidents. Form one concept that holds across all of them, something I can reuse outside these systems, and test whether it really transfers. Save the result to out/concept.md."
expect:
  - id: artifact-written
    file_exists: out/concept.md
  - id: cites-order-note
    file_matches:
      path: out/concept.md
      pattern: "(idempotency-keys|order)"
      flags: i
  - id: cites-label-note
    file_matches:
      path: out/concept.md
      pattern: "(retries\\.md|label)"
      flags: i
  - id: cites-payout-note
    file_matches:
      path: out/concept.md
      pattern: "(timeouts\\.md|payout)"
      flags: i
  - id: notes-unchanged
    unchanged: [notes]
  - id: meets-output-contract
    output_contract:
      contract: assets/output-contract.json
      file: out/concept.md
