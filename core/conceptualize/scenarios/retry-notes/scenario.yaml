# Acceptance scenario for core/conceptualize/SPEC.md §8. Hosts run it with their own eval tools.
# A section counts when a Markdown heading names it, or a label line ("Term:") does.
id: retry-notes
tags: [regression, learning]
base: base
request: "Use the conceptualize skill for this.\n\nThe three notes in notes/ come from different incidents. Form one concept that holds across all of them, something I can reuse outside these systems, and test whether it really transfers. Save the result to out/concept.md."
expect:
  - id: artifact-written
    file_exists: out/concept.md
  - id: has-definition
    file_matches:
      path: out/concept.md
      pattern: "^(#{1,6} [^\\n]*definition|\\s*[-*]?\\s*\\**[^\\n:]{0,40}definition[^\\n:]{0,20}\\**:)"
      flags: im
  - id: has-mechanism
    file_matches:
      path: out/concept.md
      pattern: "^(#{1,6} [^\\n]*mechanism|\\s*[-*]?\\s*\\**[^\\n:]{0,40}mechanism[^\\n:]{0,20}\\**:)"
      flags: im
  - id: has-evidence-section
    file_matches:
      path: out/concept.md
      pattern: "^(#{1,6} [^\\n]*(evidence|provenance)|\\s*[-*]?\\s*\\**[^\\n:]{0,40}(evidence|provenance)[^\\n:]{0,20}\\**:)"
      flags: im
  - id: cites-order-note
    file_matches:
      path: out/concept.md
      pattern: "(idempotency-keys|order)"
      flags: i
  - id: cites-label-note
    file_matches:
      path: out/concept.md
      pattern: "(retries\\.md|label)"
      flags: i
  - id: cites-payout-note
    file_matches:
      path: out/concept.md
      pattern: "(timeouts\\.md|payout)"
      flags: i
  - id: has-transfer-case
    file_matches:
      path: out/concept.md
      pattern: "^(#{1,6} [^\\n]*transfer|\\s*[-*]?\\s*\\**[^\\n:]{0,40}transfer[^\\n:]{0,20}\\**:)"
      flags: im
  - id: has-boundary
    file_matches:
      path: out/concept.md
      pattern: "^(#{1,6} [^\\n]*(counterexample|boundary|near miss)|\\s*[-*]?\\s*\\**[^\\n:]{0,40}(counterexample|boundary|near miss)[^\\n:]{0,20}\\**:)"
      flags: im
  - id: has-relations
    file_matches:
      path: out/concept.md
      pattern: "^(#{1,6} [^\\n]*(related|relation|connector)|\\s*[-*]?\\s*\\**[^\\n:]{0,40}(related|relation|connector)[^\\n:]{0,20}\\**:)"
      flags: im
  - id: notes-unchanged
    unchanged: [notes]
